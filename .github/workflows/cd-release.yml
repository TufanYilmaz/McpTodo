name: CD Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 1: Build Self-Contained Single-File Binaries for 3 Platforms
  # ============================================================================
  build-artifacts:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: mcp-todo-windows-x64.zip
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            archive: mcp-todo-linux-x64.tar.gz
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            archive: mcp-todo-osx-arm64.tar.gz
            ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@3951f000cc584e3316139f570bd6533598730ce6 # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish Self-Contained Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proj = if (Test-Path "mcp-todo/mcp-todo.csproj") { "mcp-todo/mcp-todo.csproj" } else { "mcp-todo/mcp-todo/mcp-todo/mcp-todo.csproj" }
          Write-Host "Publishing Windows binary for project: $proj"
          dotnet publish $proj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/${{ matrix.rid }}
          
          Write-Host "Compressing archive ${{ matrix.archive }}..."
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ${{ matrix.archive }}

      - name: Build and Publish Self-Contained Binary (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f "mcp-todo/mcp-todo.csproj" ]; then
            PROJ="mcp-todo/mcp-todo.csproj"
          else
            PROJ="mcp-todo/mcp-todo/mcp-todo/mcp-todo.csproj"
          fi
          echo "Publishing binary for project: $PROJ on ${{ matrix.rid }}"
          dotnet publish "$PROJ" \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/${{ matrix.rid }}
          
          echo "Compressing archive ${{ matrix.archive }}..."
          tar -czvf ${{ matrix.archive }} -C publish/${{ matrix.rid }} .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8afd # v4.6.1
        with:
          name: ${{ matrix.rid }}-artifact
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Job 2: Create GitHub Release and Upload Binary Assets
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1ab38a4ec04824db78ea8 # v4.1.9
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef299c7d870c # v2.2.1
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Job 3: Build and Push Multi-Stage Docker Image to GHCR
  # ============================================================================
  publish-docker-ghcr:
    name: Build & Push Docker Image (GHCR)
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
